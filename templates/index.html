
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Project - Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            max-width: 750px;
            width: 100%;
            padding: 60px 40px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 34px;
            margin-bottom: 15px;
        }

        p {
            color: #777;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .start-btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 18px rgba(102,126,234,0.3);
        }

        .footer {
            margin-top: 35px;
            font-size: 13px;
            color: #999;
        }

        @media(max-width: 576px) {
            .container {
                padding: 40px 22px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🎓</div>

        <h1>Student Exam Performance Indicator</h1>

        <p>
            Welcome to the Student Exam Performance Prediction System.
            This Machine Learning application predicts a student's
            Mathematics score based on demographic details,
            reading scores, writing scores, and test preparation.
        </p>

        <a href="{{ url_for('predict_datapoint') }}" class="start-btn">
            Get Started →
        </a>

        <div class="footer">
            Powered by Machine Learning
        </div>

    </div>

</body>
</html>
